# Free test deployment. No paid service or Render database is created.
# Supply a Neon Free PostgreSQL URL securely in Render, never in Git or chat.
# Free hosting may sleep; this is not reliable hosting for timed live events.
services:
  - type: web
    name: nachtrag-control
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:managed
    healthCheckPath: /api/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: HOST_SECRET
        generateValue: true
      - key: SCHEDULER_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
